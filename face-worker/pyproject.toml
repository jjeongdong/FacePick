[project]
name = "face-worker"
version = "0.1.0"
description = "photo.preview_ready를 받아 얼굴을 분석하고 앨범 안에서 인물별로 묶는다 (워커 노트북에서 실행)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka",          # Kafka 컨슈머 / DLQ 프로듀서
    "boto3",                    # 미리보기 다운로드
    "insightface",              # 얼굴 검출(SCRFD) + 임베딩(ArcFace). 사전학습 모델은 비상업 라이선스
    "onnxruntime",              # 모델 실행 (NVIDIA면 onnxruntime-gpu)
    "opencv-python-headless",   # 이미지 디코딩
    "numpy",
    "psycopg[binary]",          # faces, persons, face_analyses 저장
    "pgvector",                 # vector 타입 어댑터
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "ruff", "scikit-learn"]   # scikit-learn: 평가용 LFW 다운로드

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# 기본 실행은 단위 테스트만. 통합은 `uv run pytest -m integration` (docker compose 인프라·V10·모델 필요).
addopts = "-m 'not integration'"
markers = ["integration: docker compose 인프라(Postgres·SeaweedFS·Kafka), V10, InsightFace 모델이 필요한 테스트"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
