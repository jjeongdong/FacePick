# 내 컴퓨터에서 실행: PostgreSQL(pgvector) + S3 스토리지(SeaweedFS) + Kafka
# 워커 노트북에서 접속하려면 .env의 HOST_ADDR를 이 컴퓨터의 내부 IP 또는 Tailscale IP로 바꾼다.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: facepick
      POSTGRES_USER: facepick
      POSTGRES_PASSWORD: facepick
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facepick -d facepick"]
      interval: 5s
      retries: 10

  # S3 호환 스토리지 (MinIO 대체: MinIO 커뮤니티판은 이미지 배포 중단)
  # 버킷(photos)은 백엔드가 시작할 때 없으면 만든다.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
    ports:
      - "9000:9000"
    volumes:
      - s3data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # 클라이언트가 실제로 접속하는 주소. 워커 노트북을 쓰려면 HOST_ADDR를 바꾼다.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${HOST_ADDR:-localhost}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafkadata:/var/lib/kafka/data

volumes:
  pgdata:
  s3data:
  kafkadata:
