server:
  shutdown: graceful

spring:
  application:
    name: facepick-backend
  profiles:
    active: local
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      pool:
        # 만료 알림 발송기가 외부 API 를 기다리는 동안(최대 batch-size × 읽기 타임아웃), 앨범 정리가 사진을 지우는 동안
        # outbox relay·cleaner 가 멈추지 않게 한다.
        size: 4
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway 가 관리한다. Python 워커도 같은 테이블을 쓰므로 JPA 가 스키마를 바꾸지 않게 한다.
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 500

  kafka:
    producer:
      properties:
        # 브로커가 죽었을 때 send() 가 메타데이터를 기다리며 Relay 트랜잭션을 오래 붙잡지 않게 한다 (기본 60초).
        max.block.ms: 5000

storage:
  region: us-east-1
  bucket: photos
  presign-minutes: 15
  # 보기·다운로드용 GET URL. 한 번 받은 목록을 오래 스크롤해도 깨지지 않게 업로드 URL 보다 길게 둔다.
  download-url-minutes: 60
  # 지운 사진의 파일을 이만큼 뒤에 지운다. 업로드 URL(presign-minutes) 보다 길어야 늦게 PUT 된 원본도 지워진다.
  deletion-delay-minutes: 20
  deletion-interval-millis: 60000

jwt:
  # 운영에서는 환경 변수로 32바이트 이상 값을 넣는다. 비어 있으면 앱이 뜨지 않는다.
  secret-key: ${JWT_SECRET_KEY:}
  access-expiration-millis: 3600000
  refresh-expiration-millis: 2592000000

facepick:
  photo:
    album-purge:
      # 만료된 앨범을 이 간격으로 찾아 지운다 (PRD: 30일 뒤 삭제). 만료 즉시 대상이다.
      interval-millis: 300000
      # 한 트랜잭션에서 지우는 사진 수. 행 잠금·앨범 잠금을 오래 쥐지 않게 나눈다.
      chunk-size: 500
      # 한 번에 보는 만료 앨범 수. 계속 실패하는 앨범이 있어도 실행 하나가 끝없이 길어지지 않게 한다.
      albums-per-run: 10
  pipeline:
    # 업로드 완료 뒤 사진 처리를 넘기는 방식. event: outbox → Kafka / sync: 완료 요청 안에서 워커를 HTTP 로 호출 (비교 측정용)
    mode: event
    thumbnail-url: http://localhost:8091
    # 측정 때는 워커 노트북 IP 로 바꿔 띄운다 (--facepick.pipeline.face-url=...)
    face-url: http://localhost:8092
    connect-timeout-millis: 2000
    thumbnail-read-timeout-millis: 30000
    face-read-timeout-millis: 60000
  mail:
    # 비어 있으면 메일을 보내지 않고 알림을 FAILED 로 남긴다 (LoggingExpiryMailSender, 기동 시 WARN)
    resend-api-key: ${RESEND_API_KEY:}
    base-url: https://api.resend.com
    # 도메인 인증 전에는 Resend 테스트 주소로만 보낼 수 있고, 받는 사람도 Resend 계정 이메일만 된다.
    from: "facepick <onboarding@resend.dev>"
    # 메일의 앨범 링크 앞부분 (프론트 주소)
    app-base-url: http://localhost:5173
    connect-timeout-millis: 2000
    read-timeout-millis: 5000
    # Resend 서킷 브레이커. 타임아웃·연결 실패·5xx 만 실패로 센다 (4xx 는 요청마다의 문제, 429 는 기록하지 않음).
    circuit-breaker:
      # 최근 이만큼의 호출로 판단한다 (발송 배치 20건 안에서 판단되게)
      window-size: 10
      minimum-calls: 5
      failure-rate: 50
      # 평소 1초 안에 응답한다. 이보다 느린 호출이 slow-call-rate 넘으면 타임아웃(5초)까지 가기 전에 연다.
      slow-call-millis: 3000
      slow-call-rate: 50
      # 발송 주기와 같게 두어 다음 회차에 한 번 떠본다. 보내지 않은 알림도 이만큼 뒤에 다시 대상이 된다.
      open-seconds: 60
      half-open-calls: 2
  album:
    expiry-notice:
      # 만료 이만큼 전부터 알림 대상이 된다 (PRD: 7일 전 알림)
      days-before: 7
      scan-interval-millis: 3600000
      send-interval-millis: 60000
      batch-size: 20
      # 선점한 행을 다른 발송기가 다시 잡지 않는 시간.
      # batch-size × (연결 + 읽기 타임아웃 + send-pause) = 20 × 7.5초 = 150초보다 길어야 한다.
      lease-minutes: 5
      # 메일 한 통을 보낸 뒤 쉬는 시간. Resend 초당 요청 한도(429)에 걸리지 않게 한다.
      send-pause-millis: 500
